<text x="30" y="700" class="" text-anchor="start">D follows column data while EN is high; EN low holds the previous value. No clock, set, reset, or initial value.</text>
<text x="30" y="725" class="" text-anchor="start">Named output connections: each q[i] connects only to config_out[i]. Unpopulated positions have no output.</text>
<path d="M300 755 H650" class="bus" marker-end="url(#arrow)"/>
<text x="300" y="746" class="signal" text-anchor="start">q[9:0]</text>
<text x="665" y="760" class="signal" text-anchor="start">config_out[9:0]</text>
<text x="30" y="810" class="" text-anchor="start">Composition: parent broadcasts programming columns and row enables to both tiles</text>
<path d="M30 855 H1080" class="bus"/>
<text x="30" y="845" class="signal" text-anchor="start">program_data_in[NUM_COLUMNS-1:0] (shared)</text>
<path d="M30 900 H1080" class="bus"/>
<text x="30" y="890" class="signal" text-anchor="start">program_enable_in[NUM_ROWS-1:0]</text>
<rect x="245" y="950" width="290" height="85" class="block"/>
<text x="390" y="995" class="" text-anchor="middle">Tile A / config_memory_element</text>
<path d="M315 855 V950" class="bus" marker-end="url(#arrow)"/>
