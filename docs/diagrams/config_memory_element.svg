<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1150">
<title>Configuration memory latch mesh</title>
<desc>Implemented row-major config_memory_element connectivity: 10 plain latches, four programming columns, three active-high enable rows. Named q bit endpoints connect individually to the output vector; they are not shorted together. Bottom view shows two instances sharing parent input buses. Logical connectivity only, not physical placement.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="black"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:black}.signal{font-style:italic}.wire{fill:none;stroke:black;stroke-width:1.5}.bus{fill:none;stroke:black;stroke-width:3}.block{fill:white;stroke:black;stroke-width:1.5}.guide{fill:none;stroke:#888;stroke-width:1;stroke-dasharray:5 5}.dot{fill:black}</style>

<text x="30" y="30" class="" text-anchor="start">config_memory_element - plain latch configuration mesh</text>
<text x="30" y="55" class="" text-anchor="start">Example: NUM_BITS = 10, NUM_COLUMNS = 4, NUM_ROWS = 3</text>
<text x="30" y="80" class="" text-anchor="start">Bit i: column = i % NUM_COLUMNS; row = i / NUM_COLUMNS (integer division)</text>
<text x="215" y="120" class="signal" text-anchor="middle">program_data_in[0]</text>
